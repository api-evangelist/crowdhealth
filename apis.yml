aid: crowdhealth
name: CrowdHealth
description: 'CrowdHealth is an Austin, Texas company offering community-powered health
  care crowdfunding as an alternative to traditional health insurance. Members pay a
  monthly membership (advocacy) fee and commit a monthly contribution amount that is used
  to fund other members'' eligible medical bills peer-to-peer, without premiums, networks,
  or claim denials. The platform bundles bill negotiation, personal care advocates,
  provider search, prescription discounts and care navigation into a consumer web app and
  iOS/Android mobile apps. CrowdHealth is a consumer product company: it operates a private
  Apollo GraphQL backend at api.joincrowdhealth.com that serves its own apps, but publishes
  no public API, SDK, developer portal, or machine-readable contract of any kind.'
