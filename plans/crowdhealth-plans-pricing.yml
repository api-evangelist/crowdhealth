pricing_model: >-
  CrowdHealth does not sell named product tiers. Pricing is a two-part monthly figure
  produced by a calculator on the pricing page: a fixed per-member advocacy fee paid to
  CrowdHealth, plus a member-selected monthly contribution commitment that funds other
  members' bills. The calculator varies the total by household size and by how many
  members are 55 or older; those age/household multipliers are not published as a table.
