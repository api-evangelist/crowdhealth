    bills." Covers care advocates, bill negotiation, provider search, prescription
    discounts and access to the crowdfunding platform.
  quota: null
  overage: null
  limits:
  - Health events costing more than $500 are eligible to be crowdfunded to the Crowd.
  - Not available to residents of VT, CA, MA, NJ, RI or DC due to state-level insurance
    mandates.
  - Eligibility restrictions published for tobacco use and for stated weight thresholds.
